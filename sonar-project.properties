# Configuración de SonarQube Cloud para terravalle-backend.
# La organización y la clave del proyecto se copian de SonarQube Cloud
# (Information del proyecto) al importar el repositorio.
sonar.organization=devjie-network
sonar.projectKey=DevJIE-Network_terravalle-backend
sonar.projectName=TerraValle Backend

# Código fuente y pruebas
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Cobertura generada por `npm run test:coverage` (node:test → LCOV)
sonar.javascript.lcov.reportPaths=lcov.info
